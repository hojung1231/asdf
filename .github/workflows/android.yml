name: Android APK
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    concurrency:
      group: huggy-release
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: huggy-ci-only
          POSTGRES_DB: huggy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUGGY_SOCIAL_READY: ${{ secrets.HUGGY_SOCIAL_READY }}
      HUGGY_SUPABASE_URL: ${{ secrets.HUGGY_SUPABASE_URL }}
      HUGGY_SUPABASE_KEY: ${{ secrets.HUGGY_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Test social database permissions and retry behavior
        env:
          PGPASSWORD: huggy-ci-only
        run: |
          psql -h localhost -U postgres -d huggy_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -h localhost -U postgres -d huggy_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611040001_social.sql
          psql -h localhost -U postgres -d huggy_test -v ON_ERROR_STOP=1 -f supabase/tests/permissions.sql
          psql -h localhost -U postgres -d huggy_test -v ON_ERROR_STOP=1 -f supabase/tests/friendship_setup.sql
          psql -h localhost -U postgres -d huggy_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261104110959_mutual_friend_requests.sql
          psql -h localhost -U postgres -d huggy_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261104110959_mutual_friend_requests.sql
          psql -h localhost -U postgres -d huggy_test -v ON_ERROR_STOP=1 -f supabase/tests/friendships.sql
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing key
        env:
          HUGGY_KEYSTORE_BASE64: ${{ secrets.HUGGY_KEYSTORE_BASE64 }}
        run: |
          test -n "$HUGGY_KEYSTORE_BASE64" || { echo "Signing secret missing. Refusing to create a replacement key."; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$HUGGY_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - run: gradle :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleRelease --no-build-cache --rerun-tasks
      - name: Verify release configuration and permanent signing certificate
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          aapt="$(dirname "$signer")/aapt"
          "$aapt" dump badging "$apk" > apk-badging.txt
          if grep -q '^application-debuggable' apk-badging.txt; then
            echo 'Debuggable APK is forbidden for public release.'; exit 1
          fi
          "$aapt" dump permissions "$apk" > apk-permissions.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          permissions = set(re.findall(r"uses-permission(?:-sdk-23)?: name='([^']+)'", Path('apk-permissions.txt').read_text()))
          expected = {'android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE',
                      'android.permission.RECEIVE_BOOT_COMPLETED', 'android.permission.REQUEST_INSTALL_PACKAGES',
                      'com.hunger.log.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'}
          assert permissions <= expected, 'Unexpected permissions: ' + str(permissions - expected)
          assert 'android.permission.INTERNET' in permissions
          print('Verified release permission allowlist:', ', '.join(sorted(permissions)))
          PY
          digest=$("$signer" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test "$digest" = "29fb1185128ac4b625a3a5304145f614496fb317a9ec5b6d92e19e500cb2ffb5" || { echo "Signing certificate changed. Release blocked."; exit 1; }
          echo "Verified permanent HUGGY certificate: $digest" >> "$GITHUB_STEP_SUMMARY"
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          cp "$apk" "HUGGY-$version.apk"
          echo "HUGGY_VERSION=$version" >> "$GITHUB_ENV"
          code=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle)
          sha=$(sha256sum "HUGGY-$version.apk" | cut -d ' ' -f1)
          jq -n --argjson code "$code" --arg name "$version" --arg sha "$sha" --arg url "https://github.com/hojung1231/asdf/releases/download/huggy-v$version/HUGGY-$version.apk" '{versionCode:$code, versionName:$name, sha256:$sha, url:$url}' > huggy-update.json
      - uses: actions/upload-artifact@v4
        with:
          name: HUGGY
          path: HUGGY-*.apk
      - name: Check deployed friendship server
        if: env.HUGGY_SOCIAL_READY == 'true'
        run: |
          if curl --fail --silent --show-error --max-time 20 "$HUGGY_SUPABASE_URL/rest/v1/rpc/huggy_health" -H "apikey: $HUGGY_SUPABASE_KEY" -H 'Content-Type: application/json' -d '{}' | jq -e '.version >= 2' >/dev/null; then
            echo 'HUGGY_FRIENDSHIPS_READY=true' >> "$GITHUB_ENV"
          else
            echo 'Friend approval migration is pending. APK tested; public release held until the server is ready.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish APK download
        if: env.HUGGY_SOCIAL_READY == 'true' && env.HUGGY_SUPABASE_URL != '' && env.HUGGY_SUPABASE_KEY != '' && env.HUGGY_FRIENDSHIPS_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="huggy-v$HUGGY_VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "HUGGY $HUGGY_VERSION" --notes "Update HUGGY without removing the installed app. Records and account are preserved. Starting with 2.2, new releases can be installed from the update button in HUGGY or its widgets."
          fi
          gh release upload "$tag" "HUGGY-$HUGGY_VERSION.apk" huggy-update.json --clobber
