name: Android APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-24.04
    concurrency:
      group: hunger-log-signing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: hunger-log-signing-v1
          fail-on-cache-miss: true
      - name: Prepare signing key
        run: |
          mkdir -p ~/.android
          test -s ~/.android/debug.keystore || { echo "Existing signing key missing. Refusing to create a different key."; exit 1; }
      - run: gradle :app:assembleDebug --no-build-cache --rerun-tasks
      - name: Verify update signature against version 1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41751777762 --repo hojung1231/asdf --name hunger-log-apk --dir /tmp/huggy-v12
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          old=$("$signer" verify --print-certs /tmp/huggy-v12/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          new=$("$signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "Version 1.2 certificate: $old"
          echo "Update certificate: $new"
          test -n "$old" && test "$old" = "$new" || { echo "Signature mismatch. Update blocked."; exit 1; }
          echo "Verified: version 1.2 and this update use the same signing certificate."
          echo "Certificate SHA-256: $new" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hunger-log-apk
          path: app/build/outputs/apk/debug/app-debug.apk
