name: Android APK
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    concurrency:
      group: huggy-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing key
        env:
          HUGGY_KEYSTORE_BASE64: ${{ secrets.HUGGY_KEYSTORE_BASE64 }}
        run: |
          test -n "$HUGGY_KEYSTORE_BASE64" || { echo "Signing secret missing. Refusing to create a replacement key."; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$HUGGY_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - run: gradle :app:assembleDebug --no-build-cache --rerun-tasks
      - name: Verify permanent signing certificate
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          digest=$("$signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test "$digest" = "29fb1185128ac4b625a3a5304145f614496fb317a9ec5b6d92e19e500cb2ffb5" || { echo "Signing certificate changed. Release blocked."; exit 1; }
          echo "Verified permanent HUGGY certificate: $digest" >> "$GITHUB_STEP_SUMMARY"
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk "HUGGY-$version.apk"
          echo "HUGGY_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: HUGGY
          path: HUGGY-*.apk
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="huggy-v$HUGGY_VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "HUGGY $HUGGY_VERSION" --notes "Install the APK from Assets. This release starts permanent signing. Earlier installations must be removed once. Removing the old app deletes its saved records."
          fi
          gh release upload "$tag" "HUGGY-$HUGGY_VERSION.apk" --clobber
